<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>¿Mito o realidad? · Resultados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F1FA;--ink:#1D1A33;--soft:#5E5A7A;--line:#E2DEF0;
  --accent:#FF3D7F;--accent2:#6A4CFF;--mito:#FF3D7F;--real:#14B88A;--duda:#B7B1CF;
  --font:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html{background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:clamp(1rem,1.3vw,1.25rem);line-height:1.45}
main{max-width:72rem;margin:0 auto;padding:clamp(1rem,2.5vw,2rem) clamp(1rem,3vw,2.5rem) 1rem}
[hidden]{display:none !important}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.8rem 1.5rem;margin-bottom:clamp(1rem,2vw,1.6rem)}
h1{margin:0;font-size:clamp(1.8rem,3.4vw,2.8rem);font-weight:800;letter-spacing:-.02em;line-height:1.05}
h1 span{color:var(--accent)}
.tally{display:flex;flex-wrap:wrap;gap:.5rem}
.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:.35rem .9rem;font-weight:600;font-variant-numeric:tabular-nums}
.pill b{font-size:1.15em}
.demo{background:#FFF4C2;border-color:#F2D75C;color:#6B5200}
.live{display:inline-flex;align-items:center;gap:.4rem}
.live::before{content:"";width:.6rem;height:.6rem;border-radius:50%;background:#14B88A;box-shadow:0 0 0 0 rgba(20,184,138,.6);animation:ping 1.6s infinite}
@keyframes ping{70%{box-shadow:0 0 0 .6rem rgba(20,184,138,0)}100%{box-shadow:0 0 0 0 rgba(20,184,138,0)}}

.stage{background:#fff;border:1px solid var(--line);border-radius:28px;padding:clamp(1.2rem,3vw,2.4rem);box-shadow:0 18px 40px rgba(29,26,51,.08)}
.num{color:var(--soft);font-weight:600;margin:0 0 .4rem}
.stmt{font-size:clamp(1.6rem,3.3vw,2.6rem);font-weight:800;line-height:1.18;letter-spacing:-.01em;margin:0 0 clamp(1rem,2.4vw,1.8rem)}
.rows{display:grid;gap:clamp(.7rem,1.6vw,1.1rem)}
.row{display:grid;grid-template-columns:clamp(6rem,11vw,9rem) 1fr clamp(2.5rem,4vw,3.5rem);align-items:center;gap:.8rem}
.row .who{font-weight:700}
.row .n{color:var(--soft);font-size:.85em;text-align:right;font-variant-numeric:tabular-nums}
.bar{display:flex;height:clamp(2.4rem,4.2vw,3.4rem);border-radius:14px;overflow:hidden;background:#F1EEF8}
.seg{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;white-space:nowrap;overflow:hidden;transition:flex-basis .7s ease;font-variant-numeric:tabular-nums}
.seg.m{background:var(--mito)}.seg.r{background:var(--real)}.seg.d{background:var(--duda);color:#2B2745}
.empty{color:var(--soft);font-style:italic;padding-left:.6rem;align-self:center}
.legend{display:flex;flex-wrap:wrap;gap:1.2rem;margin:clamp(.9rem,2vw,1.3rem) 0 0;color:var(--soft);font-weight:600}
.legend i{display:inline-block;width:.9rem;height:.9rem;border-radius:4px;margin-right:.4rem;vertical-align:-.1rem}

.controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.8rem;margin-top:clamp(1rem,2vw,1.4rem)}
.nav{display:flex;align-items:center;gap:.5rem}
.btn{font:inherit;font-weight:700;min-height:48px;padding:.6rem 1.3rem;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.btn.primary{border:0;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 22px rgba(106,76,255,.28)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}
.dots{display:flex;gap:.4rem}
.dot{width:.85rem;height:.85rem;border-radius:50%;border:0;padding:0;background:#D9D4EA;cursor:pointer}
.dot.on{background:var(--accent2);transform:scale(1.25)}
.dot:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}

.reveal{margin-top:clamp(1rem,2.4vw,1.6rem);border-radius:22px;padding:clamp(1rem,2.4vw,1.6rem);display:grid;grid-template-columns:auto 1fr;gap:.4rem 1.2rem;align-items:start;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.reveal.isMito{background:#FFE6EF;border:2px solid var(--mito)}
.reveal.isReal{background:#DDF6EE;border:2px solid var(--real)}
.verdict{grid-row:span 2;font-size:clamp(1.6rem,3vw,2.4rem);font-weight:800;color:#fff;border-radius:16px;padding:.4rem 1rem;align-self:center}
.isMito .verdict{background:var(--mito)}.isReal .verdict{background:var(--real)}
.why{margin:0;font-size:1.08em;font-weight:600}
.src{margin:0;color:var(--soft);font-size:.88em}

.firma{text-align:center;color:var(--soft);padding:1.6rem 1rem 1.2rem;font-size:.95rem}
.firma p{margin:0}
.firma .marca{font-family:"Dancing Script","Brush Script MT",cursive;text-transform:none;font-size:1.45rem;color:var(--accent);margin-top:.15rem}
@media (min-width:900px) and (max-height:860px){
  main{padding-top:.9rem}
  header{margin-bottom:.7rem}
  .stage{padding:1.1rem 1.8rem}
  .stmt{font-size:clamp(1.4rem,2.6vw,2rem);margin-bottom:.8rem}
  .bar{height:2.3rem}
  .rows{gap:.55rem}
  .legend{margin-top:.6rem}
  .reveal{margin-top:.8rem;padding:.8rem 1.2rem}
  .verdict{font-size:1.7rem}
  .controls{margin-top:.7rem}
  .firma{padding:.8rem 1rem .6rem}
}
@media (max-width:560px){.row{grid-template-columns:5rem 1fr 2.2rem}.reveal{grid-template-columns:1fr}.verdict{grid-row:auto;justify-self:start}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<main>
  <header>
    <h1>¿Mito o <span>realidad</span>?</h1>
    <div class="tally" aria-live="polite">
      <span class="pill live" id="state">En vivo</span>
      <span class="pill"><b id="tTotal">0</b> respuestas</span>
      <span class="pill">🍎 <b id="tDoc">0</b> docentes</span>
      <span class="pill">🏡 <b id="tFam">0</b> familias</span>
    </div>
  </header>

  <section class="stage" aria-live="polite">
    <p class="num" id="num"></p>
    <h2 class="stmt" id="stmt"></h2>
    <div class="rows" id="rows"></div>
    <div class="legend" aria-hidden="true">
      <span><i style="background:var(--mito)"></i>Mito</span>
      <span><i style="background:var(--real)"></i>Realidad</span>
      <span><i style="background:var(--duda)"></i>No estoy segura/o</span>
    </div>
    <div class="reveal" id="reveal" hidden>
      <span class="verdict" id="verdict"></span>
      <p class="why" id="why"></p>
      <p class="src" id="src"></p>
    </div>
  </section>

  <div class="controls">
    <div class="nav">
      <button class="btn" id="prev" aria-label="Frase anterior">←</button>
      <div class="dots" id="dots" role="group" aria-label="Elegir frase"></div>
      <button class="btn" id="next" aria-label="Frase siguiente">→</button>
    </div>
    <button class="btn primary" id="revealBtn">Revelar</button>
  </div>
</main>
<footer class="firma">
  <p>Karina Doello</p>
  <p class="marca">Tecnología que abraza</p>
</footer>
<script>
(function(){
  /* ===== CONEXIÓN CON LA PLANILLA (se completa una sola vez) ===== */
  var DATA_URL='';   // dirección de la aplicación web de Apps Script (termina en /exec)
  /* =============================================================== */

  var Q=[
    {t:'Los videos educativos ayudan a que los bebés aprendan a hablar.',a:'Mito',
     w:'Bebés de 12 a 18 meses que miraron un DVD “educativo” durante un mes no aprendieron más palabras que quienes nunca lo vieron.',
     s:'DeLoache y otros, Psychological Science, 2010.'},
    {t:'Si la tele está prendida de fondo pero el nene juega, no le afecta.',a:'Mito',
     w:'Con la tele de fondo, los adultos les hablan a los chicos alrededor de un 20 % menos, y la interacción es menos atenta.',
     s:'Kirkorian y otros, Child Development, 2009.'},
    {t:'Lo más importante es cuánto tiempo pasan frente a la pantalla.',a:'Mito',
     w:'Las recomendaciones ponen límites de tiempo, pero insisten igual en qué se mira y en mirar acompañados, conversando sobre lo que ven.',
     s:'Academia Americana de Pediatría, “Media and Young Minds”, 2016.'},
    {t:'Como son nativos digitales, los chicos entienden la tecnología mejor que los adultos.',a:'Mito',
     w:'Saber usar no es lo mismo que entender. No hay evidencia de que haber nacido con la tecnología dé un conocimiento más profundo de ella.',
     s:'Kirschner y De Bruyckere, Teaching and Teacher Education, 2017.'},
    {t:'Usar la pantalla para calmar un berrinche puede dificultar que aprenda a calmarse solo.',a:'Realidad',
     w:'Usar seguido el celular o la tablet para calmar a chicos de 3 a 5 años se asoció con más dificultades para regular sus emociones meses después.',
     s:'Radesky y otros, JAMA Pediatrics, 2022. Es una asociación, no prueba de causa.'},
    {t:'Los algoritmos le muestran a cada chico lo que es mejor para él.',a:'Mito',
     w:'Los sistemas de recomendación se diseñan para que sigamos mirando. El de YouTube, por ejemplo, se entrenó para predecir cuánto tiempo vamos a mirar.',
     s:'Covington, Adams y Sargin, Google (RecSys), 2016.'},
    {t:'Prohibir las pantallas en casa protege a los chicos del mundo digital.',a:'Mito',
     w:'Restringir reduce algunos riesgos, pero también las oportunidades y las habilidades digitales. Acompañar es lo que las desarrolla.',
     s:'Livingstone y Helsper, Journal of Communication, 2017.'}
  ];
  var OPTS=['Mito','Realidad','No estoy segura/o'];
  var cur=0,revealed={},rows=[],demo=!DATA_URL;

  function demoRows(){
    var out=[],bias=[.62,.55,.45,.48,.35,.5,.42];
    for(var n=0;n<34;n++){
      var r=[n%3===0?'Familia':'Docente'];
      for(var k=0;k<7;k++){var x=Math.random();r.push(x<bias[k]*.75?'Realidad':(x<.85?'Mito':'No estoy segura/o'))}
      out.push(r);
    }
    return out;
  }
  function count(filter,k){
    var c={Mito:0,Realidad:0,'No estoy segura/o':0},tot=0;
    rows.forEach(function(r){if(filter&&r[0]!==filter)return;var v=r[k+1];if(c.hasOwnProperty(v)){c[v]++;tot++}});
    return {c:c,tot:tot};
  }
  function bar(label,filter){
    var res=count(filter,cur),html='<div class="row"><span class="who">'+label+'</span><div class="bar">';
    if(!res.tot){html+='<span class="empty">Sin respuestas todavía</span>'}
    else{[['Mito','m'],['Realidad','r'],['No estoy segura/o','d']].forEach(function(o){
      var p=Math.round(100*res.c[o[0]]/res.tot);
      html+='<span class="seg '+o[1]+'" style="flex-basis:'+p+'%" title="'+o[0]+': '+p+'%">'+(p>=9?p+'%':'')+'</span>';
    })}
    return html+'</div><span class="n">'+res.tot+'</span></div>';
  }
  function render(){
    var q=Q[cur];
    document.getElementById('num').textContent='Frase '+(cur+1)+' de '+Q.length;
    document.getElementById('stmt').textContent='“'+q.t+'”';
    document.getElementById('rows').innerHTML=bar('Todos','')+bar('🍎 Docentes','Docente')+bar('🏡 Familias','Familia');
    var rv=document.getElementById('reveal');
    if(revealed[cur]){
      rv.hidden=false;rv.className='reveal '+(q.a==='Mito'?'isMito':'isReal');
      document.getElementById('verdict').textContent=q.a.toUpperCase();
      document.getElementById('why').textContent=q.w;
      document.getElementById('src').textContent='Fuente: '+q.s;
    }else rv.hidden=true;
    var rb=document.getElementById('revealBtn');rb.textContent=revealed[cur]?'Ocultar respuesta':'Revelar';
    document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===Q.length-1;
    [].forEach.call(document.getElementById('dots').children,function(d,k){d.classList.toggle('on',k===cur);d.setAttribute('aria-current',k===cur?'true':'false')});
    var doc=rows.filter(function(r){return r[0]==='Docente'}).length,fam=rows.filter(function(r){return r[0]==='Familia'}).length;
    document.getElementById('tTotal').textContent=rows.length;document.getElementById('tDoc').textContent=doc;document.getElementById('tFam').textContent=fam;
  }
  var dots=document.getElementById('dots');
  Q.forEach(function(_,k){var d=document.createElement('button');d.className='dot';d.setAttribute('aria-label','Frase '+(k+1));d.addEventListener('click',function(){cur=k;render()});dots.appendChild(d)});
  document.getElementById('prev').addEventListener('click',function(){if(cur>0){cur--;render()}});
  document.getElementById('next').addEventListener('click',function(){if(cur<Q.length-1){cur++;render()}});
  document.getElementById('revealBtn').addEventListener('click',function(){revealed[cur]=!revealed[cur];render()});
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'&&cur<Q.length-1){cur++;render()}
    else if(e.key==='ArrowLeft'&&cur>0){cur--;render()}
    else if(e.key===' '||e.key==='Enter'){if(document.activeElement===document.body){e.preventDefault();revealed[cur]=!revealed[cur];render()}}
  });

  var state=document.getElementById('state');
  function load(){
    if(demo){if(!rows.length)rows=demoRows();state.textContent='Datos de ejemplo';state.className='pill demo';render();return}
    fetch(DATA_URL+(DATA_URL.indexOf('?')<0?'?':'&')+'t='+Date.now())
      .then(function(r){return r.json()})
      .then(function(j){rows=(j.rows||[]).filter(function(r){return r&&r[0]});state.textContent='En vivo';state.className='pill live';render()})
      .catch(function(){state.textContent='Sin conexión: reintentando…';state.className='pill demo'});
  }
  render();load();
  if(!demo)setInterval(load,5000);
})();
</script>
</body>
</html>
